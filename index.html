<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Orbit by Trula.ai — attendance tracking, leave management, work-from-home requests, approvals, announcements, people directory and org chart in one role-aware HR workspace for employees, managers and admins."
    />
    <meta name="theme-color" content="#0f172a" />

    <!-- Social sharing (Open Graph + Twitter) — mirrors the landing page copy. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Orbit by Trula.ai" />
    <meta property="og:title" content="Orbit — Your whole workforce, in one orbit." />
    <meta
      property="og:description"
      content="Every HR essential in a single, role-aware workspace: attendance, leave, WFH, approvals, announcements, people and your org chart."
    />
    <meta property="og:image" content="/logo.svg" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Orbit — Your whole workforce, in one orbit." />
    <meta
      name="twitter:description"
      content="Attendance, leave, WFH, approvals, announcements, people and org chart — one HR workspace for every role."
    />
    <!-- Inter — the UI font the design system's --sans stack asks for. Loaded
         explicitly (it was previously referenced in CSS but never fetched, so
         every browser silently fell back to its system font). -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
    />
    <title>Orbit by Trula.ai — Workforce management, simplified</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
