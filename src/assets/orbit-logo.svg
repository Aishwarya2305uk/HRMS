    <linearGradient id="orbitG" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffd48a"/>
      <stop offset="0.45" stop-color="#f59e0b"/>
      <stop offset="1" stop-color="#c2660a"/>
    </linearGradient>
  </defs>
  <g fill="none" stroke="url(#orbitG)" stroke-width="1" opacity="0.9">
