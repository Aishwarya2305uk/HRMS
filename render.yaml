# Render Blueprint — deploys the backend as a web service.
#
# Usage: Render dashboard -> New -> Blueprint -> point at this repo. Render
# reads this file and creates the service. Secrets (marked `sync: false`)
# are left blank in the YAML on purpose — you'll be prompted to fill them in
# during the Blueprint setup, so nothing sensitive is committed here.
#
# End-of-day attendance finalization: the app finalizes lazily on read
# (services/attendance.js), so no scheduler is REQUIRED for correctness.
# Render's Cron Job service type has no free plan, so it's not part of this
# blueprint. If you want a true nightly run anyway, either:
#   - add a paid cron service here running `npm run finalize`, or
#   - set CRON_SECRET on hrms-api and point any free scheduler (GitHub
#     Actions, cron-job.org) at:
#       GET https://<your-render-url>/api/cron/finalize
#       Authorization: Bearer <CRON_SECRET>
services:
  - type: web
    name: hrms-api
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm run server
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_NAME
        value: Administrator
